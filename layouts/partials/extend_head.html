<!-- Extended head for improved accessibility and modern features -->

<!-- Vibrant favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">

<!-- Improved color scheme meta tags -->
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#818cf8" media="(prefers-color-scheme: dark)">

<!-- Preload fonts for better performance -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

<!-- Additional accessibility improvements -->
<meta name="color-scheme" content="light dark">

<!-- Open Graph improvements for better social sharing -->
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">

<!-- Skip to main content link for accessibility -->
<style>
    .skip-to-main {
        position: absolute;
        top: -40px;
        left: 0;
        background: var(--accent-color);
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 100;
        border-radius: 0 0 4px 0;
        font-weight: 600;
    }

    .skip-to-main:focus {
        top: 0;
    }

    /* Enhanced header with colorful gradient accent */
    .header {
        position: relative;
    }

    .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #0ea5e9 100%);
        z-index: 10;
    }

    .header .logo {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #0ea5e9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 800 !important;
        font-size: 1.5rem !important;
    }

    /* Fun hover effect for navigation links */
    .header .menu a {
        position: relative;
        background: linear-gradient(135deg, var(--accent-color), var(--secondary-accent-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0.8;
        transition: opacity 0.2s ease;
    }

    .header .menu a:hover {
        opacity: 1;
    }

    /* Colorful post entry cards with gradient borders */
    .post-entry {
        position: relative;
        overflow: hidden;
    }

    .post-entry::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(180deg, #4f46e5 0%, #7c3aed 50%, #0ea5e9 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .post-entry:hover::before {
        opacity: 1;
    }

    /* Colorful date and metadata */
    .post-meta {
        color: var(--secondary-accent-color) !important;
        font-weight: 600 !important;
    }

    /* Enhanced theme toggle with colorful animation */
    #theme-toggle {
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    #theme-toggle:hover {
        transform: scale(1.1) rotate(20deg);
        filter: drop-shadow(0 0 8px var(--accent-color));
    }

    /* Crisp font rendering */
    * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: "liga" 1, "kern" 1;
    }

    /* Fun gradient text for post titles */
    .post-title a {
        background: linear-gradient(135deg, var(--content) 0%, var(--accent-color) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transition: background 0.3s ease;
    }

    .post-title a:hover {
        background: linear-gradient(135deg, var(--accent-color) 0%, var(--secondary-accent-color) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .dark .post-title a {
        background: linear-gradient(135deg, var(--content) 0%, var(--accent-color) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
</style>
