<!-- Extended head for improved accessibility and modern features -->

<!-- Improved color scheme meta tags -->
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#818cf8" media="(prefers-color-scheme: dark)">

<!-- Preload fonts for better performance -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

<!-- Additional accessibility improvements -->
<meta name="color-scheme" content="light dark">

<!-- Open Graph improvements for better social sharing -->
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">

<!-- Skip to main content link for accessibility -->
<style>
    .skip-to-main {
        position: absolute;
        top: -40px;
        left: 0;
        background: var(--accent-color);
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 100;
        border-radius: 0 0 4px 0;
        font-weight: 600;
    }

    .skip-to-main:focus {
        top: 0;
    }
</style>
