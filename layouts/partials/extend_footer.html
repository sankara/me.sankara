<!-- Extended footer for modern, fun, and accessible design -->

<style>
    .footer-content {
        max-width: var(--main-width);
        margin: 0 auto;
        padding: 0 var(--gap);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
        text-align: center;
    }

    .footer-top {
        width: 100%;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid transparent;
        border-image: linear-gradient(90deg, transparent 0%, #4f46e5 20%, #7c3aed 50%, #0ea5e9 80%, transparent 100%);
        border-image-slice: 1;
    }

    .footer-tagline {
        font-size: 1.125rem;
        font-weight: 600;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #0ea5e9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
    }

    .footer-description {
        color: var(--content-secondary);
        font-size: 0.9rem;
        max-width: 500px;
        margin: 0 auto;
    }

    .footer-links {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
        margin: 0.5rem 0;
    }

    .footer-links a {
        color: var(--content-secondary);
        font-weight: 600;
        transition: all 0.2s ease;
        position: relative;
        padding: 0.5rem 1rem;
        border-radius: 8px;
    }

    .footer-links a:hover {
        color: var(--accent-color);
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(14, 165, 233, 0.1));
        transform: translateY(-2px);
    }

    .footer-links a::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #4f46e5, #0ea5e9);
        transition: width 0.3s ease;
    }

    .footer-links a:hover::before {
        width: 80%;
    }

    .footer-copyright {
        color: var(--content-secondary);
        font-size: 0.875rem;
        margin-top: 0.5rem;
    }

    .footer-made-with {
        font-size: 0.8rem;
        color: var(--content-secondary);
        opacity: 0.8;
    }

    .footer-made-with .heart {
        color: #ef4444;
        animation: heartbeat 1.5s ease-in-out infinite;
        display: inline-block;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
        .footer-made-with .heart {
            animation: none;
        }
    }

    @media (max-width: 768px) {
        .footer-links {
            flex-direction: column;
            gap: 0.75rem;
        }
    }
</style>

<div class="footer-content">
    <div class="footer-top">
        <div class="footer-tagline">Sankara's Blog</div>
        <div class="footer-description">Thoughts on life, technology, and everything in between</div>
    </div>
    <nav class="footer-links" aria-label="Footer navigation">
        <a href="/posts" aria-label="View all blog posts">Posts</a>
        <a href="/about" aria-label="Learn more about Sankara">About</a>
        <a href="/index.xml" aria-label="Subscribe via RSS feed">RSS Feed</a>
    </nav>
    <div class="footer-copyright">
        <p>© {{ now.Year }} Sankara. All rights reserved.</p>
        <p class="footer-made-with">Made with <span class="heart">♥</span> using Hugo</p>
    </div>
</div>
