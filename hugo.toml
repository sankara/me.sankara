baseURL = 'https://sankara.me/'
title = "Sankara's Blog"
theme = "sankara"
languageCode = 'en-us'
description = "Thoughts on life, technology, and everything in between"

[params]
author = "Sankara"

[taxonomies]
tag = 'tags'
topic = 'topics'
series = 'series'

[[menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 1

[[menus.main]]
name = 'About'
pageRef = '/about'
weight = 2

[outputs]
home = ["html", "rss"]

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
