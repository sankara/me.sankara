<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
    {{- partial "head.html" . -}}
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    {{- partial "header.html" . -}}

    <main id="main" class="main">
        {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}

    {{- partial "scripts.html" . -}}
</body>
</html>
