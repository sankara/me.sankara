{{ define "main" }}
<div class="terms-page container">
    <header class="list-header">
        <h1>{{ .Title }}</h1>
    </header>

    <ul class="terms-list">
        {{ range .Pages }}
        <li>
            <a href="{{ .Permalink }}">
                {{ .Title }}
                <span class="count">({{ len .Pages }})</span>
            </a>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
